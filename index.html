<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subin Khadka | Personal Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-size: 2.2rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            background: #3498db;
            color: #ffffff;
            padding: 12px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #2980b9;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Subin Khadka</h1>
        <p>Welcome to my personal corner of the internet! I am currently hosting this site on GitHub Pages using my .com.np domain.</p>
        
        <div class="links">
            <a href="https://github.com/" target="_blank" class="btn">GitHub Profile</a>
            <a href="https://linkedin.com/" target="_blank" class="btn">Connect on LinkedIn</a>
            <a href="mailto:your-email@example.com" class="btn">Contact Me</a>
        </div>

        <div class="footer">
            &copy; 2026 Subin Khadka. All Rights Reserved.
        </div>
    </div>

</body>
</html>
